<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Wake versus cold start</title>
  <desc>Waking a model from CPU RAM or disk takes under two seconds; loading it from scratch takes thirty-five.</desc>
  <style>
    .bg{fill:#ffffff} .ink{fill:#0f172a} .mut{fill:#64748b}
    .grid{stroke:#cbd5e1;stroke-width:1;stroke-dasharray:3 4}
    .axis{stroke:#cbd5e1;stroke-width:1.5}
    .t{font-size:19px;font-weight:700} .s{font-size:12.5px}
    .v{font-size:13px;font-weight:700} .ax{font-size:12px}
    .cap{font-size:11.5px}
      @media (prefers-color-scheme: dark) {
        .bg   { fill:#0b1220; }
        .ink  { fill:#f1f5f9; }
        .mut  { fill:#94a3b8; }
        .grid { stroke:#334155; }
        .axis { stroke:#475569; }
      }
  </style>
  <rect class="bg" width="900" height="420"/>

<text class="t ink" x="40" y="34">Bringing a model back: wake vs cold start</text>
<text class="s mut" x="40" y="56">RTX 3070 Laptop (8 GB), vLLM 0.32.0, eager mode. Log scale — each gridline is 10x.</text>
<line class="grid" x1="150.0" y1="82" x2="150.0" y2="340"/>
<text class="ax mut" x="150.0" y="358" text-anchor="middle">0.3s</text>
<line class="grid" x1="311.3" y1="82" x2="311.3" y2="340"/>
<text class="ax mut" x="311.3" y="358" text-anchor="middle">1s</text>
<line class="grid" x1="458.6" y1="82" x2="458.6" y2="340"/>
<text class="ax mut" x="458.6" y="358" text-anchor="middle">3s</text>
<line class="grid" x1="619.9" y1="82" x2="619.9" y2="340"/>
<text class="ax mut" x="619.9" y="358" text-anchor="middle">10s</text>
<line class="grid" x1="767.1" y1="82" x2="767.1" y2="340"/>
<text class="ax mut" x="767.1" y="358" text-anchor="middle">30s</text>
<text class="v ink" x="16" y="106">qwen-0.5b</text>
<text class="cap mut" x="16" y="124">2458 MiB resident</text>
<rect x="150" y="92" width="91.1" height="20" rx="4" fill="#3b82f6"/>
<text class="cap ink" x="249.1" y="106">0.592s &#183; wake from CPU RAM</text>
<rect x="150" y="122" width="114.7" height="20" rx="4" fill="#f59e0b"/>
<text class="cap ink" x="272.7" y="136">0.706s &#183; wake from disk</text>
<rect x="150" y="152" width="639.0" height="20" rx="4" fill="#64748b"/>
<text class="cap ink" x="797.0" y="166">35.33s &#183; cold start</text>
<text class="v ink" x="16" y="212">qwen3-0.6b</text>
<text class="cap mut" x="16" y="230">2621 MiB resident</text>
<rect x="150" y="198" width="135.2" height="20" rx="4" fill="#3b82f6"/>
<text class="cap ink" x="293.2" y="212">0.823s &#183; wake from CPU RAM</text>
<rect x="150" y="228" width="167.5" height="20" rx="4" fill="#f59e0b"/>
<text class="cap ink" x="325.5" y="242">1.047s &#183; wake from disk</text>
<rect x="150" y="258" width="641.3" height="20" rx="4" fill="#64748b"/>
<text class="cap ink" x="799.3" y="272">35.94s &#183; cold start</text>
<text class="v ink" x="16" y="318">qwen-1.5b</text>
<text class="cap mut" x="16" y="336">4506 MiB resident</text>
<rect x="150" y="304" width="219.2" height="20" rx="4" fill="#3b82f6"/>
<text class="cap ink" x="377.2" y="318">1.54s &#183; wake from CPU RAM</text>
<rect x="150" y="334" width="241.1" height="20" rx="4" fill="#f59e0b"/>
<text class="cap ink" x="399.1" y="348">1.813s &#183; wake from disk</text>
<rect x="150" y="364" width="646.6" height="20" rx="4" fill="#64748b"/>
<text class="cap ink" x="804.6" y="378">37.37s &#183; cold start</text>
<line class="axis" x1="150" y1="82" x2="150" y2="340"/>
<text class="s ink" x="150" y="388"><tspan font-weight="700">59.7x faster</tspan> to wake qwen-0.5b from CPU RAM than to load it from scratch.</text>
<text class="cap mut" x="150" y="406">Cold start is roughly flat across model sizes because it is dominated by process spawn, CUDA init and profiling — not by reading weights.</text>
</svg>