<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Kiln</title>
  <desc>The Kiln wordmark: a kiln chamber holding three stacked model slots, two glowing hot in VRAM and one cooled, beside the project name.</desc>
  <defs>
    <linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <style>
      .name  { font-size:66px; font-weight:700; fill:#0f172a; letter-spacing:-1.5px; }
      .tag   { font-size:17px; fill:#64748b; letter-spacing:.02em; }
      .brick { fill:none; stroke:#94a3b8; stroke-width:3; }
      @media (prefers-color-scheme: dark) {
        .name { fill:#f8fafc; }
        .tag  { fill:#94a3b8; }
        .brick{ stroke:#64748b; }
      }
    </style>
  </defs>

  <!-- kiln chamber -->
  <rect class="brick" x="22" y="26" width="128" height="128" rx="14"/>
  <path class="brick" d="M22 60 H150 M22 94 H150 M22 128 H150" opacity=".35"/>

  <!-- three model slots: two hot in VRAM, one paged out -->
  <rect x="38" y="106" width="96" height="18" rx="5" fill="url(#heat)"/>
  <rect x="38" y="76"  width="96" height="18" rx="5" fill="url(#heat)" opacity=".85"/>
  <rect x="38" y="46"  width="96" height="18" rx="5" fill="url(#cool)" opacity=".7"/>

  <!-- the paged-out one drifting off to host memory -->
  <path d="M142 55 C170 55 170 40 186 40" stroke="#60a5fa" stroke-width="3" fill="none" stroke-dasharray="5 5" stroke-linecap="round"/>
  <circle cx="190" cy="40" r="5" fill="#60a5fa"/>

  <text class="name" x="218" y="92">Kiln</text>
  <text class="tag"  x="221" y="122">self-hosted LLM inference serving</text>
</svg>
