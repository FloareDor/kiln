<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Kiln model state machine</title>
  <desc>A model moves COLD to STARTING to ACTIVE. Eviction goes ACTIVE to DRAINING to either SLEEPING_L1 or SLEEPING_L2, and back through WAKING to ACTIVE. A drain that is abandoned returns straight to ACTIVE. Any state can fail.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .s      { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; rx:9; }
      .hot    { fill:#ecfdf5; stroke:#6ee7b7; stroke-width:2; rx:9; }
      .sleep  { fill:#eff6ff; stroke:#93c5fd; stroke-width:1.5; rx:9; }
      .bad    { fill:#fef2f2; stroke:#fca5a5; stroke-width:1.5; rx:9; }
      .n      { font-size:13px; font-weight:650; fill:#0f172a; text-anchor:middle; }
      .t      { font-size:10.5px; fill:#64748b; text-anchor:middle; }
      .e      { stroke:#94a3b8; stroke-width:1.6; fill:none; marker-end:url(#a); }
      .ew     { stroke:#c2410c; stroke-width:1.8; fill:none; marker-end:url(#aw); }
      .ef     { stroke:#b91c1c; stroke-width:1.3; fill:none; marker-end:url(#af); stroke-dasharray:4 3; }
      .el     { font-size:10.5px; fill:#475569; }
      .elw    { font-size:10.5px; fill:#c2410c; font-weight:600; }
      @media (prefers-color-scheme: dark) {
        .s{fill:#1e293b;stroke:#475569;} .hot{fill:#0f2e22;stroke:#10b981;}
        .sleep{fill:#132338;stroke:#3b82f6;} .bad{fill:#2a1414;stroke:#dc2626;}
        .n{fill:#f1f5f9;} .t{fill:#94a3b8;} .el{fill:#cbd5e1;}
      }
    </style>
  </defs>

  <rect class="s" x="20" y="150" width="104" height="52"/>
  <text class="n" x="72" y="174">COLD</text>
  <text class="t" x="72" y="190">no process</text>

  <rect class="s" x="164" y="150" width="104" height="52"/>
  <text class="n" x="216" y="174">STARTING</text>
  <text class="t" x="216" y="190">loading weights</text>

  <rect class="hot" x="310" y="150" width="112" height="52"/>
  <text class="n" x="366" y="174">ACTIVE</text>
  <text class="t" x="366" y="190">serving · in VRAM</text>

  <rect class="s" x="470" y="150" width="112" height="52"/>
  <text class="n" x="526" y="174">DRAINING</text>
  <text class="t" x="526" y="190">no new requests</text>

  <rect class="sleep" x="646" y="76" width="130" height="52"/>
  <text class="n" x="711" y="100">SLEEPING_L1</text>
  <text class="t" x="711" y="116">weights → host RAM</text>

  <rect class="sleep" x="646" y="224" width="130" height="52"/>
  <text class="n" x="711" y="248">SLEEPING_L2</text>
  <text class="t" x="711" y="264">weights discarded</text>

  <rect class="s" x="470" y="300" width="112" height="52"/>
  <text class="n" x="526" y="324">WAKING</text>
  <text class="t" x="526" y="340">restoring VRAM</text>

  <rect class="bad" x="310" y="24" width="112" height="46"/>
  <text class="n" x="366" y="45">FAILED</text>
  <text class="t" x="366" y="60">retry with backoff</text>

  <!-- forward path -->
  <path class="e" d="M 124 176 L 162 176"/>
  <path class="e" d="M 268 176 L 308 176"/>

  <path class="e" d="M 422 176 L 468 176"/>
  <text class="el" x="424" y="166">evict</text>

  <path class="e" d="M 582 166 L 614 166 L 614 108 L 644 108"/>
  <text class="el" x="588" y="130">hot enough +</text>
  <text class="el" x="588" y="144">host RAM free</text>

  <path class="e" d="M 582 190 L 614 190 L 614 248 L 644 248"/>
  <text class="el" x="588" y="222">cold, or host</text>
  <text class="el" x="588" y="236">budget full</text>

  <!-- wake path -->
  <path class="ew" d="M 646 110 L 606 110 L 606 326 L 584 326"/>
  <path class="ew" d="M 646 258 L 620 258 L 620 326 L 584 326"/>
  <text class="elw" x="624" y="300">wake</text>

  <path class="ew" d="M 468 326 L 400 326 L 400 204"/>
  <text class="elw" x="404" y="300">serving again</text>

  <!-- abandoned drain -->
  <path class="e" d="M 524 148 L 524 120 L 392 120 L 392 148"/>
  <text class="el" x="400" y="113">drain abandoned — wanted again, no swap paid</text>

  <!-- demotion -->
  <path class="e" d="M 790 110 L 820 110 L 820 250 L 778 250"/>
  <text class="el" x="800" y="172">idle</text>
  <text class="el" x="800" y="186">demote</text>

  <!-- stop -->
  <path class="e" d="M 646 266 L 600 280 L 120 280 L 90 280 L 72 280 L 72 204"/>
  <text class="el" x="300" y="294">stop — process reclaimed; next request pays a full cold start</text>

  <!-- failure -->
  <path class="ef" d="M 222 150 L 240 90 L 308 56"/>
  <path class="ef" d="M 366 148 L 366 72"/>
  <path class="ef" d="M 526 300 L 440 300 L 424 64"/>
  <path class="e" d="M 310 40 L 70 40 L 70 148"/>
  <text class="el" x="140" y="34">retry</text>
</svg>
