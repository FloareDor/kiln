<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 224" width="900" height="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Router comparison</title>
  <desc>Median time to first token and how evenly each router spread work across two replicas of one model.</desc>
  <style>
    .bg{fill:#ffffff} .ink{fill:#0f172a} .mut{fill:#64748b}
    .grid{stroke:#cbd5e1;stroke-width:1;stroke-dasharray:3 4}
    .axis{stroke:#cbd5e1;stroke-width:1.5}
    .t{font-size:19px;font-weight:700} .s{font-size:12.5px}
    .v{font-size:13px;font-weight:700} .ax{font-size:12px}
    .cap{font-size:11.5px}
      @media (prefers-color-scheme: dark) {
        .bg   { fill:#0b1220; }
        .ink  { fill:#f1f5f9; }
        .mut  { fill:#94a3b8; }
        .grid { stroke:#334155; }
        .axis { stroke:#475569; }
      }
  </style>
  <rect class="bg" width="900" height="224"/>

<text class="t ink" x="24" y="34">Routing: median TTFT and replica balance</text>
<text class="s mut" x="24" y="56">Agent-style traffic — a long system prompt and tool definitions resent every turn. Two replicas of one model.</text>
<text class="v ink" x="24" y="107">least-loaded</text>
<text class="cap mut" x="24" y="125">21 requests</text>
<rect x="190" y="92" width="490.0" height="24" rx="5" fill="#ea580c"/>
<text class="v ink" x="690.0" y="109">86 ms p50</text>
<text class="cap mut" x="190" y="136">p95 3995 ms &#183; spread across replicas: 17 / 4</text>
<text class="cap mut" x="24" y="204">An even spread is not automatically better: affinity concentrates a conversation on one replica on purpose, to reuse its KV cache.</text>
</svg>