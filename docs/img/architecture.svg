<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Kiln architecture</title>
  <desc>Clients talk to a Go gateway, which owns GPU residency and routing. A control plane owns deployments and drives deploy jobs out of Postgres. One node agent per GPU runs vLLM processes as children and performs sleep, wake and start.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <style>
      .box   { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; rx:10; }
      .gpu   { fill:#fff7ed; stroke:#fdba74; stroke-width:1.5; rx:10; }
      .data  { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.5; rx:10; }
      .title { font-size:15px; font-weight:650; fill:#0f172a; }
      .sub   { font-size:11.5px; fill:#475569; }
      .tiny  { font-size:10.5px; fill:#64748b; }
      .lbl   { font-size:11px; fill:#475569; }
      .accent{ font-size:11px; fill:#c2410c; font-weight:600; }
      .edge  { stroke:#94a3b8; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .edgeA { stroke:#c2410c; stroke-width:2; fill:none; marker-end:url(#arrowAccent); }
      .zone  { fill:none; stroke:#e2e8f0; stroke-width:1.5; stroke-dasharray:5 4; rx:14; }
      .zlbl  { font-size:11px; fill:#94a3b8; font-weight:600; letter-spacing:.06em; }
      @media (prefers-color-scheme: dark) {
        .box  { fill:#1e293b; stroke:#475569; }
        .gpu  { fill:#2a1f14; stroke:#b45309; }
        .data { fill:#172033; stroke:#475569; }
        .title{ fill:#f1f5f9; }
        .sub, .lbl { fill:#cbd5e1; }
        .tiny { fill:#94a3b8; }
        .zone { stroke:#334155; }
      }
    </style>
  </defs>

  <!-- clients -->
  <rect class="box" x="330" y="14" width="320" height="52"/>
  <text class="title" x="490" y="38" text-anchor="middle">Clients</text>
  <text class="sub"   x="490" y="55" text-anchor="middle">OpenAI SDK · curl · Locust — base URL swap, no other change</text>

  <line class="edge" x1="490" y1="66" x2="490" y2="92"/>

  <!-- gateway -->
  <rect class="box" x="188" y="94" width="604" height="118"/>
  <text class="title" x="212" y="118">Gateway (Go)</text>
  <text class="sub"   x="212" y="137">OpenAI-compatible API · SSE streaming · API keys · per-team quotas</text>
  <text class="sub"   x="212" y="154">per-model queue with backpressure · pluggable replica Router</text>

  <rect class="gpu" x="470" y="162" width="302" height="40"/>
  <text class="accent" x="484" y="179">Swap controller — owns GPU residency</text>
  <text class="tiny"   x="484" y="194">drain · evict · wake · coalesce · anti-thrash</text>

  <text class="tiny" x="212" y="180">Ensure(model) runs before routing, so a request</text>
  <text class="tiny" x="212" y="195">for a sleeping model waits for a wake, not a 503.</text>

  <!-- why residency lives here -->
  <rect class="zone" x="806" y="94" width="166" height="118"/>
  <text class="zlbl" x="818" y="114">WHY HERE?</text>
  <text class="tiny" x="818" y="134">A model may only be slept</text>
  <text class="tiny" x="818" y="149">once in-flight requests hit</text>
  <text class="tiny" x="818" y="164">zero. The gateway is the</text>
  <text class="tiny" x="818" y="179">only component that knows</text>
  <text class="tiny" x="818" y="194">that count exactly and now.</text>

  <!-- control plane -->
  <rect class="box" x="24" y="246" width="238" height="116"/>
  <text class="title" x="44" y="270">Control plane (Go)</text>
  <text class="sub"   x="44" y="289">model registry · admin API</text>
  <text class="sub"   x="44" y="306">deploy job workers (×N)</text>
  <text class="tiny"  x="44" y="328">SELECT … FOR UPDATE SKIP LOCKED</text>
  <text class="tiny"  x="44" y="343">+ leases, so a crashed worker's</text>
  <text class="tiny"  x="44" y="358">job is reclaimed, not lost.</text>

  <!-- postgres -->
  <rect class="data" x="24" y="394" width="238" height="96"/>
  <text class="title" x="44" y="418">PostgreSQL</text>
  <text class="sub"   x="44" y="437">teams · api_keys · quotas · usage</text>
  <text class="sub"   x="44" y="454">models · replicas · deploy_jobs</text>
  <text class="tiny"  x="44" y="476">measured footprint + wake costs</text>

  <line class="edge" x1="143" y1="362" x2="143" y2="392"/>

  <!-- gateway -> control plane / db -->
  <path class="edge" d="M 188 150 L 150 150 L 150 244"/>
  <text class="lbl" x="92" y="196">deployments,</text>
  <text class="lbl" x="92" y="211">quotas, usage</text>

  <!-- node agents -->
  <rect class="zone" x="300" y="238" width="660" height="258"/>
  <text class="zlbl" x="316" y="258">GPU NODES — ONE AGENT POD PER GPU, THE ONLY POD REQUESTING nvidia.com/gpu</text>

  <rect class="gpu" x="322" y="272" width="300" height="200"/>
  <text class="title" x="342" y="296">Node agent (Go) — DaemonSet</text>
  <text class="sub"   x="342" y="315">owns GPU 0 · spawns vLLM as children</text>
  <text class="sub"   x="342" y="332">start · stop · sleep(level) · wake · status</text>
  <text class="tiny"  x="342" y="352">kills process groups: vLLM's engine-core</text>
  <text class="tiny"  x="342" y="367">child would otherwise keep the GPU.</text>

  <rect class="box" x="342" y="382" width="86" height="34"/>
  <text class="sub" x="385" y="403" text-anchor="middle">vLLM A</text>
  <rect class="box" x="438" y="382" width="86" height="34"/>
  <text class="sub" x="481" y="403" text-anchor="middle">vLLM B</text>
  <rect class="box" x="534" y="382" width="70" height="34"/>
  <text class="sub" x="569" y="403" text-anchor="middle">vLLM C</text>
  <text class="tiny" x="342" y="437">one process per replica, own port,</text>
  <text class="tiny" x="342" y="452">--enable-sleep-mode, dev endpoints on</text>

  <rect class="gpu" x="648" y="272" width="290" height="200"/>
  <text class="title" x="668" y="296">Node agent — GPU 1</text>
  <text class="sub"   x="668" y="315">same binary, no Kubernetes required</text>
  <text class="tiny"  x="668" y="337">Runs standalone under plain Docker,</text>
  <text class="tiny"  x="668" y="352">which is how the Modal scale runs work.</text>
  <rect class="box" x="668" y="382" width="86" height="34"/>
  <text class="sub" x="711" y="403" text-anchor="middle">vLLM D</text>
  <rect class="box" x="764" y="382" width="86" height="34"/>
  <text class="sub" x="807" y="403" text-anchor="middle">vLLM E</text>
  <text class="tiny" x="668" y="437">GPU + host memory reported via</text>
  <text class="tiny" x="668" y="452">nvidia-smi and /proc/meminfo</text>

  <!-- gateway -> agents (swap + inference) -->
  <path class="edgeA" d="M 621 212 L 621 236 L 472 236 L 472 270"/>
  <text class="accent" x="486" y="231">sleep / wake / start</text>

  <path class="edge" d="M 700 212 L 700 268"/>
  <text class="lbl" x="710" y="236">inference + status poll</text>

  <!-- control plane -> agents -->
  <path class="edge" d="M 262 300 L 300 300 L 318 300"/>
  <text class="lbl" x="266" y="292">deploy</text>

  <!-- tier ladder -->
  <rect class="zone" x="24" y="520" width="936" height="122"/>
  <text class="zlbl" x="40" y="540">GPU MEMORY TIERING — MEASURED ON AN RTX 3070 (8 GB), Qwen2.5-0.5B, vLLM 0.32.0</text>

  <rect class="gpu" x="40" y="552" width="216" height="74"/>
  <text class="title" x="56" y="574">VRAM · ACTIVE</text>
  <text class="sub"   x="56" y="592">like resident pages</text>
  <text class="accent" x="56" y="614">switch cost: 0</text>

  <rect class="box" x="272" y="552" width="216" height="74"/>
  <text class="title" x="288" y="574">Host RAM · SLEEPING_L1</text>
  <text class="sub"   x="288" y="592">like swap — vLLM sleep level 1</text>
  <text class="accent" x="288" y="614">wake 0.59–0.88 s · 39× faster</text>

  <rect class="box" x="504" y="552" width="216" height="74"/>
  <text class="title" x="520" y="574">Disk · SLEEPING_L2</text>
  <text class="sub"   x="520" y="592">like a page file — level 2 + reload</text>
  <text class="accent" x="520" y="614">wake 0.71–1.87 s · 18× faster</text>

  <rect class="box" x="736" y="552" width="216" height="74"/>
  <text class="title" x="752" y="574">Not loaded · COLD</text>
  <text class="sub"   x="752" y="592">spawn, load weights, profile</text>
  <text class="accent" x="752" y="614">cold start 34–41 s</text>

  <path class="edge" d="M 256 589 L 270 589"/>
  <path class="edge" d="M 488 589 L 502 589"/>
  <path class="edge" d="M 720 589 L 734 589"/>
</svg>
