# Prometheus + Grafana for Kiln.
#
# Deliberately a single-file, single-replica setup rather than kube-prometheus-stack:
# this cluster exists to produce the experiment figures, and an operator-managed
# monitoring stack would be several hundred lines of YAML whose failure modes have
# nothing to do with the project.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: kiln
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kiln-prometheus
rules:
  # Prometheus discovers targets by reading the API, so it needs read access to the
  # objects it scrapes. Nothing here grants write access to anything.
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: ["/metrics"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kiln-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kiln-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: kiln
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: kiln
data:
  prometheus.yml: |
    global:
      # 2s, far tighter than the usual 15s. A model wake takes under a second, and a
      # 15s scrape would alias the swap transients the experiments are about into
      # invisibility.
      scrape_interval: 2s
      evaluation_interval: 15s

    scrape_configs:
      # Pods opt in with prometheus.io/scrape, so adding a component does not mean
      # editing this file.
      - job_name: kiln-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kiln]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: kiln
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Long enough to keep a full experiment sweep, short enough to fit on a
            # laptop's disk.
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 2Gi }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: kiln
spec:
  type: NodePort
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: kiln
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.kiln.svc.cluster.local:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: kiln
        folder: Kiln
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: kiln
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.5.1
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: admin }
            # Anonymous viewing so a screenshot for the README does not need a login,
            # and so the dashboard is usable from a phone during a demo.
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
          ports: [{ containerPort: 3000 }]
          volumeMounts:
            - { name: provisioning-datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: provisioning-dashboards, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: provisioning-datasources
          configMap:
            name: grafana-provisioning
            items: [{ key: datasources.yaml, path: datasources.yaml }]
        - name: provisioning-dashboards
          configMap:
            name: grafana-provisioning
            items: [{ key: dashboards.yaml, path: dashboards.yaml }]
        - name: dashboards
          configMap: { name: grafana-dashboards, optional: true }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: kiln
spec:
  type: NodePort
  selector: { app: grafana }
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
